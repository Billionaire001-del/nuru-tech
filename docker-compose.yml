services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://chatbot:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/chatbot
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  postgres_data:
