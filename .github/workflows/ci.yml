name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
          META_APP_SECRET: ci-secret
          META_VERIFY_TOKEN: ci-verify
          WHATSAPP_ACCESS_TOKEN: ci-token
          WHATSAPP_PHONE_NUMBER_ID: 123456
          ADMIN_API_KEY: ci-admin-key-that-is-at-least-32-chars
